<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to NGN Converter</title>
     <link rel="stylesheet" href="index.css">
    
</head>

<body>

    <div class="container">
        <h1>USD → NGN Converter</h1>

        <label for="usd">Amount in USD ($)</label>
        <input type="number" id="usd" placeholder="Enter USD amount">

        <label for="rate">Exchange Rate (₦ per $1)</label>
        <input type="number" id="rate" placeholder="Enter exchange rate">

        <button onclick="convertCurrency()">Convert</button>

        <div id="result">Enter values to convert</div>
    </div>

   
<script src="script.js"></script>
</body>
</html>
